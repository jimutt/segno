# Types, lint, licence headers, tests with coverage, build and size budget on every push and pull request.
# @decision(DL-011)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint and format (Biome)
        run: npm run lint
      - name: Licence headers
        run: npm run license-headers
      - name: Tests with coverage
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Size budget
        run: npm run size
      - name: Import the built package
        run: npm run smoke
